app-id: com.beavernotes.beavernotes
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: "25.08"
command: beaver-notes
finish-args:
  - --device=dri
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
  - --filesystem=host
  - --filesystem=xdg-run/gvfs
  - --filesystem=xdg-run/gvfsd
  - --share=ipc
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=fallback-x11
  - --talk-name=org.gtk.vfs.*
  - --own-name=org.gtk.vfs.*
rename-desktop-file: beaver-notes.desktop
rename-icon: beaver-notes
modules:
  - name: beaver-notes
    buildsystem: simple
    build-commands:
      - tar -xf Beaver-Notes-*.tar.gz
      - mkdir -p $FLATPAK_DEST/opt/beaver-notes
      - cp -r Beaver-Notes-*/lib/beaver-notes/* $FLATPAK_DEST/opt/beaver-notes/
      - mkdir -p $FLATPAK_DEST/bin
      - ln -s /opt/beaver-notes/beaver-notes $FLATPAK_DEST/bin/beaver-notes
      - mkdir -p $FLATPAK_DEST/share
      - cp -r Beaver-Notes-*/share/* $FLATPAK_DEST/share/
      - desktop-file-edit --set-key=Categories --set-value="X-Productivity;" $FLATPAK_DEST/share/applications/beaver-notes.desktop
      - desktop-file-edit --set-key=Exec --set-value="beaver-notes %U" $FLATPAK_DEST/share/applications/beaver-notes.desktop
      - install -Dm0644 com.beavernotes.beavernotes.metainfo.xml -t $FLATPAK_DEST/share/metainfo/
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://github.com/Beaver-Notes/Beaver-Notes/releases/download/5.0.0/Beaver-Notes-5.0.0-x86_64.tar.gz
        sha256: <hash>
      - type: archive
        only-arches:
          - aarch64
        url: https://github.com/Beaver-Notes/Beaver-Notes/releases/download/5.0.0/Beaver-Notes-5.0.0-aarch64.tar.gz
        sha256: <hash>
