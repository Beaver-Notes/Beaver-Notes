name: Release Beta

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*-beta.*'

permissions:
  contents: write

concurrency:
  group: release-beta
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  validate:
    name: Validate beta versions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_match: ${{ steps.jurisdiction.outputs.version_match }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        shell: bash
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Read version from package.json
        id: version
        shell: bash
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Fail on version drift
        shell: bash
        run: |
          set -euo pipefail

          PKG_VERSION="$(node -p "require('./package.json').version")"

          TAURI_VERSION="$(node -e "console.log(JSON.parse(require('fs').readFileSync('./src-tauri/tauri.beta.conf.json', 'utf8')).version)")"
          CARGO_VERSION="$(node - <<'NODE'
          const fs = require('fs');
          const txt = fs.readFileSync('./src-tauri/Cargo.toml', 'utf8');
          const m = txt.match(/^\s*version\s*=\s*"(.*?)"/m);
          console.log(m ? m[1] : '');
          NODE
          )"

          echo "package.json:         $PKG_VERSION"
          echo "tauri.beta.conf.json: $TAURI_VERSION"
          echo "Cargo.toml:           $CARGO_VERSION"

          test "$PKG_VERSION" = "$TAURI_VERSION"
          test "$PKG_VERSION" = "$CARGO_VERSION"

      - name: Check jurisdiction
        id: jurisdiction
        shell: bash
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$PKG_VERSION" != *"-"* ]]; then
            echo "version_match=false" >> "$GITHUB_OUTPUT"
            echo "Skipping — this is a stable version, use the stable workflow."
          else
            echo "version_match=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        shell: bash
        run: |
          yarn install --frozen-lockfile

      - name: Run lint
        shell: bash
        run: |
          yarn lint

      - name: Run typecheck
        shell: bash
        run: |
          yarn typecheck

      - name: Run unit tests
        shell: bash
        run: yarn test

      - name: Install Linux dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libfreetype-dev \
            libfontconfig-dev \
            patchelf \
            xdg-utils \
            gnupg

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: validate

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Audit npm dependencies
        shell: bash
        run: |
          yarn audit --audit-level=high

      - name: Run knip (dead code detection)
        shell: bash
        run: |
          yarn knip --no-progress

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit Rust dependencies
        shell: bash
        run: |
          cd src-tauri && cargo audit

  create-release:
    name: Create beta draft release
    if: ${{ needs.validate.outputs.version_match == 'true' }}
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.tag.outputs.tag_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine beta release tag
        id: tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "tag_name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=v${{ needs.validate.outputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create empty draft prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: ${{ needs.validate.outputs.version }}
          draft: true
          prerelease: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.CUSTOM_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

  desktop:
    name: Build beta ${{ matrix.id }}
    if: ${{ needs.validate.outputs.version_match == 'true' }}
    needs:
      - validate
      - create-release
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos-universal
            runner: macos-latest
            rust_targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
            tauri_target: 'universal-apple-darwin'
            bundle_args: '--bundles app,dmg'
            asset_suffix: 'macos-universal'
          - id: linux-x64
            runner: ubuntu-24.04
            rust_targets: 'x86_64-unknown-linux-gnu'
            tauri_target: 'x86_64-unknown-linux-gnu'
            asset_suffix: 'linux-x64'
          - id: linux-arm64
            runner: ubuntu-24.04-arm
            rust_targets: 'aarch64-unknown-linux-gnu'
            tauri_target: 'aarch64-unknown-linux-gnu'
            asset_suffix: 'linux-arm64'
          - id: windows-x64
            runner: windows-latest
            rust_targets: 'x86_64-pc-windows-msvc'
            tauri_target: 'x86_64-pc-windows-msvc'
            bundle_args: '--bundles nsis'
            asset_suffix: 'windows-x64'
          - id: windows-arm64
            runner: windows-11-arm
            rust_targets: 'aarch64-pc-windows-msvc'
            tauri_target: 'aarch64-pc-windows-msvc'
            bundle_args: '--bundles nsis'
            asset_suffix: 'windows-arm64'
          - id: android
            runner: ubuntu-24.04
            rust_targets: 'aarch64-linux-android,x86_64-linux-android'
            asset_suffix: 'android'
          - id: ios
            runner: macos-latest
            rust_targets: 'aarch64-apple-ios'
            asset_suffix: 'ios'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node with Yarn cache
        if: ${{ !env.ACT }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Setup Node without cache
        if: ${{ env.ACT }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        shell: bash
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn --version

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        if: ${{ !env.ACT }}
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Install Linux dependencies
        if: ${{ startsWith(matrix.id, 'linux-') }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libfreetype-dev \
            libfontconfig-dev \
            patchelf \
            xdg-utils \
            gnupg

      - name: Install JS dependencies
        shell: bash
        run: |
          yarn install --frozen-lockfile

      - name: Build macOS beta bundles
        if: ${{ matrix.id == 'macos-universal' }}
        shell: bash
        env:
          CI: 'true'
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_SIGNING_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          yarn tauri build \
            --config src-tauri/tauri.beta.conf.json \
            --target "${{ matrix.tauri_target }}" \
            ${{ matrix.bundle_args }} \
            --ci

      - name: Build Linux beta binary
        if: ${{ startsWith(matrix.id, 'linux-') }}
        shell: bash
        env:
          CI: 'true'
        run: |
          yarn tauri build \
            --config src-tauri/tauri.beta.conf.json \
            --target "${{ matrix.tauri_target }}" \
            --bundles app \
            --ci

      # Dispatch Windows signing to OSSign workflow
      - name: Dispatch Windows signing
        if: ${{ startsWith(matrix.id, 'windows-') }}
        uses: ossign/actions/workflow/dispatch@main
        id: dispatch
        with:
          username: beaver-notes
          token: ${{ secrets.SIGNING_TOKEN }}

      - name: Parse signed artifacts
        if: ${{ startsWith(matrix.id, 'windows-') }}
        shell: bash
        run: |
          printf "%s" "${{ steps.dispatch.outputs.signed_artifacts }}" > artifacts.json
          echo "parsed=$(cat artifacts.json)" >> "$GITHUB_OUTPUT"

      - name: Download signed artifacts
        if: ${{ startsWith(matrix.id, 'windows-') }}
        shell: bash
        run: |
          mkdir -p signed
          for url in $(jq -r '.[].browser_download_url' artifacts.json); do
            echo "Downloading $url"
            curl -L -o "signed/$(basename "$url")" "$url"
          done

      - name: Stage macOS beta assets
        if: ${{ matrix.id == 'macos-universal' }}
        shell: bash
        run: |
          set -euo pipefail

          TARGET="${{ matrix.tauri_target }}"
          OUT="release-assets"
          mkdir -p "$OUT"

          find "src-tauri/target/${TARGET}/release/bundle" -type f \
            \( -name "*.dmg" -o -name "*.app.tar.gz" -o -name "*.sig" -o -name "latest.json" \) \
            -exec cp {} "$OUT"/ \;

      - name: Stage Linux beta assets
        if: ${{ startsWith(matrix.id, 'linux-') }}
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          VERSION="${{ needs.validate.outputs.version }}"
          TARGET="${{ matrix.tauri_target }}"
          OUT="release-assets"
          BIN_NAME="beaver-notes"
          BIN_PATH="src-tauri/target/${TARGET}/release/${BIN_NAME}"
          TAR_NAME="Beaver-Notes-Beta-${VERSION}-${{ matrix.asset_suffix }}.tar.gz"

          mkdir -p "$OUT"

          # Create portable directory with binary, icon, and desktop entry
          mkdir -p portable-root
          cp "$BIN_PATH" portable-root/
          cp buildResources/beta/icon.png portable-root/beaver-notes.png

          cat > portable-root/beaver-notes.desktop << 'DESKTOP'
          [Desktop Entry]
          Name=Beaver Notes Beta
          Comment=A clean, native markdown notes app (Beta)
          Exec=beaver-notes
          Icon=beaver-notes
          Type=Application
          Categories=Utility;TextEditor;Office;
          MimeType=text/markdown;text/plain;
          DESKTOP

          tar -czf "$OUT/$TAR_NAME" -C portable-root .

          # Sign the tarball for updater
          yarn tauri signer sign \
            --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" \
            "$OUT/$TAR_NAME"

      # Android build
      - name: Install Java
        if: ${{ matrix.id == 'android' }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK
        if: ${{ matrix.id == 'android' }}
        uses: android-actions/setup-android@v3

      - name: Regenerate Android project for CI
        if: ${{ matrix.id == 'android' }}
        shell: bash
        run: |
          rm -rf src-tauri/gen/android
          yarn tauri android init

      - name: Setup Android keystore
        if: ${{ matrix.id == 'android' }}
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/keystore.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"

          # Verify keystore was created
          if [ ! -f "$KEYSTORE_PATH" ]; then
            echo "::error::Failed to create keystore file"
            exit 1
          fi

          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=$KEYSTORE_PATH
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Set Android build number
        if: ${{ matrix.id == 'android' }}
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version.replace(/-.*$/, '')")"
          cat > src-tauri/gen/android/app/tauri.properties << EOF
          tauri.android.versionName=$VERSION
          tauri.android.versionCode=${{ github.run_number }}
          EOF

      - name: Build Android beta app
        if: ${{ matrix.id == 'android' }}
        shell: bash
        env:
          CI: 'true'
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
        run: |
          yarn tauri android build --apk --aab --config src-tauri/tauri.beta.conf.json

      # iOS build
      # iOS build
      - name: Regenerate iOS project
        if: ${{ matrix.id == 'ios' }}
        shell: bash
        run: |
          rm -rf src-tauri/gen/apple
          yarn tauri ios init

      - name: Build iOS beta app
        if: ${{ matrix.id == 'ios' }}
        shell: bash
        env:
          CI: 'true'
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_IOS_SIGNING_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_IOS_SIGNING_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/app-store-connect-api-key"
          echo "$APPLE_API_KEY" > "$RUNNER_TEMP/app-store-connect-api-key/AuthKey_${APPLE_API_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/app-store-connect-api-key/AuthKey_${APPLE_API_KEY_ID}.p8"

          export APPLE_API_KEY_PATH="$RUNNER_TEMP/app-store-connect-api-key/AuthKey_${APPLE_API_KEY_ID}.p8"
          yarn tauri ios build --config src-tauri/tauri.beta.conf.json

      - name: Stage Windows beta assets
        if: ${{ startsWith(matrix.id, 'windows-') }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path release-assets) { Remove-Item -Recurse -Force release-assets }
          Move-Item signed release-assets

          # Add portable zip
          $version = "${{ needs.validate.outputs.version }}"
          $target = "${{ matrix.tauri_target }}"
          $out = "release-assets"
          $binPath = "src-tauri/target/$target/release/beaver-notes.exe"
          if (Test-Path $binPath) {
            $portableName = "Beaver Notes Beta-$version-portable-${{ matrix.asset_suffix }}.zip"
            Compress-Archive -Path $binPath -DestinationPath "$out/$portableName"
          }

      # Android release assets: APK and AAB
      - name: Stage Android beta assets
        if: ${{ matrix.id == 'android' }}
        shell: bash
        run: |
          set -euo pipefail
          OUT="release-assets"
          mkdir -p "$OUT"
          find "src-tauri/gen/android/app/build/outputs" -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -exec cp {} "$OUT"/ \;

      # iOS release assets
      - name: Find iOS IPA
        if: ${{ matrix.id == 'ios' }}
        id: find-ipa
        continue-on-error: true
        shell: bash
        run: |
          IPA=$(find src-tauri/gen/apple/build -name "*.ipa" -type f | head -1)
          if [ -n "$IPA" ]; then
            echo "ipa-path=$IPA" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No .ipa file found"
          fi

      - name: Stage iOS beta assets
        if: ${{ matrix.id == 'ios' && steps.find-ipa.outputs.ipa-path != '' }}
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p release-assets
          cp "${{ steps.find-ipa.outputs.ipa-path }}" release-assets/

      # Upload iOS IPA to TestFlight via App Store Connect API
      - name: Upload to TestFlight
        if: ${{ matrix.id == 'ios' && steps.find-ipa.outputs.ipa-path != '' }}
        continue-on-error: true
        uses: apple-actions/upload-testflight-build@v4
        with:
          app-path: ${{ steps.find-ipa.outputs.ipa-path }}
          issuer-id: ${{ secrets.APPLE_API_ISSUER }}
          api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPLE_API_KEY }}
          wait-for-processing: false

      - name: Upload to beta release
        if: ${{ hashFiles('release-assets/*') != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CUSTOM_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.create-release.outputs.tag_name }}" release-assets/* --clobber
