name: Release

on:
  push:
    tags:
      - 'v*'
      - '!v*-beta.*'
  workflow_dispatch:
    inputs:
      target:
        description: 'Build target (all, android, ios, macos-universal, linux-x64, linux-arm64, windows)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - android
          - ios
          - macos-universal
          - linux-x64
          - linux-arm64
          - windows

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ github.event.inputs.target || 'all' }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  validate:
    name: Validate versions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ github.run_number }}
      tag_name: ${{ steps.tag.outputs.tag_name }}
      version_match: ${{ steps.jurisdiction.outputs.version_match }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node Setup
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        shell: bash
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      # package.json is the source of truth for the release version.
      - name: Read version from package.json
        id: version
        shell: bash
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # If this is a tag push, use that tag. Otherwise build one from package.json.
      - name: Determine release tag
        id: tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "tag_name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=v${{ steps.version.outputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      # Fail if package.json, tauri.conf.json, and Cargo.toml disagree.
      # Also fail if a pre-release version (beta) is accidentally pushed as stable.
      - name: Fail on version drift
        shell: bash
        run: |
          set -euo pipefail

          PKG_VERSION="$(node -p "require('./package.json').version")"
          PKG_TAURI_VERSION="${PKG_VERSION%%-*}"
          TAURI_VERSION="$(node -e "console.log(JSON.parse(require('fs').readFileSync('./src-tauri/tauri.conf.json', 'utf8')).version)")"
          CARGO_VERSION="$(node - <<'NODE'
          const fs = require('fs');
          const txt = fs.readFileSync('./src-tauri/Cargo.toml', 'utf8');
          const m = txt.match(/^\[package\][\s\S]*?^version\s*=\s*"(.*?)"/m);
          console.log(m ? m[1] : '');
          NODE
          )"

          echo "package.json: $PKG_VERSION"
          echo "tauri.conf.json: $TAURI_VERSION"
          echo "Cargo.toml: $CARGO_VERSION"

          test "$PKG_TAURI_VERSION" = "$TAURI_VERSION"
          test "$PKG_TAURI_VERSION" = "$CARGO_VERSION"

      - name: Check jurisdiction
        id: jurisdiction
        shell: bash
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$PKG_VERSION" == *"-"* ]]; then
            echo "version_match=false" >> "$GITHUB_OUTPUT"
            echo "Skipping — this is a pre-release version, use the beta workflow."
          else
            echo "version_match=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        shell: bash
        run: |
          yarn install --frozen-lockfile

      - name: Run lint
        shell: bash
        run: |
          yarn lint

      - name: Run typecheck
        shell: bash
        run: |
          yarn typecheck

      - name: Run unit tests
        shell: bash
        run: yarn test

      - name: Install Linux dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libfreetype-dev \
            libfontconfig-dev \
            libudev-dev \
            patchelf \
            xdg-utils \
            gnupg

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: validate

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Audit npm dependencies
        shell: bash
        run: |
          set +e
          yarn audit --json > /tmp/yarn-audit.json 2>&1
          status=$?
          set -e
          node -e "const fs=require('fs'); const s=fs.readFileSync('/tmp/yarn-audit.json','utf8'); const lines=s.split(/\n+/).filter(Boolean); let high=0; for(const line of lines){try{const obj=JSON.parse(line); if(obj.type==='auditSummary'){high=obj.data.vulnerabilities.high||0;}}catch{}} if(high>0){console.error('High vulnerabilities: '+high); process.exit(1);} console.log('No high vulnerabilities'); process.exit(0)"

      - name: Run knip (dead code detection)
        shell: bash
        run: |
          yarn knip --no-progress

      # Rust audit — catches RUSTSEC advisories
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit Rust dependencies
        shell: bash
        run: |
          cd src-tauri && cargo audit

  targets:
    name: Resolve targets
    runs-on: ubuntu-latest
    needs: validate
    outputs:
      android: ${{ steps.t.outputs.android }}
      ios: ${{ steps.t.outputs.ios }}
      macos-universal: ${{ steps.t.outputs.macos-universal }}
      linux-x64: ${{ steps.t.outputs.linux-x64 }}
      linux-arm64: ${{ steps.t.outputs.linux-arm64 }}
      windows: ${{ steps.t.outputs.windows }}
      matrix: ${{ steps.t.outputs.matrix }}
    steps:
      - id: t
        shell: bash
        env:
          TARGET: ${{ github.event.inputs.target || 'all' }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          target = os.environ.get("TARGET", "all")
          items = [
            {"id":"macos-universal","runner":"macos-latest","rust_targets":"aarch64-apple-darwin,x86_64-apple-darwin","tauri_target":"universal-apple-darwin","bundle_args":"--bundles app,dmg","asset_suffix":"macos-universal"},
            {"id":"linux-x64","runner":"ubuntu-24.04","rust_targets":"x86_64-unknown-linux-gnu","tauri_target":"x86_64-unknown-linux-gnu","asset_suffix":"linux-x64"},
            {"id":"linux-arm64","runner":"ubuntu-24.04-arm","rust_targets":"aarch64-unknown-linux-gnu","tauri_target":"aarch64-unknown-linux-gnu","asset_suffix":"linux-arm64"},
            {"id":"android","runner":"ubuntu-24.04","rust_targets":"aarch64-linux-android,x86_64-linux-android","asset_suffix":"android"},
            {"id":"ios","runner":"xcode-27","rust_targets":"aarch64-apple-ios","asset_suffix":"ios"},
          ]
          selected = [i for i in items if target in ("all", i["id"])]
          for id in ["android","ios","macos-universal","linux-x64","linux-arm64","windows"]:
            print(f"{id}={'true' if target in ('all', id) else 'false'}")
          print("matrix=" + json.dumps(selected, separators=(",", ":")))
          PY

      - name: Notice when Windows is excluded
        shell: bash
        env:
          WINDOWS: ${{ steps.t.outputs.windows }}
        run: |
          if [ "$WINDOWS" != "true" ]; then
            echo "::notice::Windows is not included in this release target; choose target=all or target=windows to build it"
          fi

  create-release:
    name: Create draft release
    if: ${{ needs.validate.outputs.version_match == 'true' }}
    needs: [validate, targets]
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.id }}

    steps:
      - name: Create empty draft release
        id: create
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag_name }}
          name: ${{ needs.validate.outputs.version }}
          draft: true
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.CUSTOM_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Prune stale draft assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CUSTOM_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${{ needs.validate.outputs.tag_name }}"
          VERSION="${{ needs.validate.outputs.version }}"
          is_draft="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
          test "$is_draft" = "true" || { echo "::error::Refusing to prune non-draft release"; exit 1; }
          for name in $(gh release view "$TAG" --json assets --jq '.assets[].name'); do
            if python3 - "$VERSION" "$name" <<'PY'
          import re
          import sys

          try:
              version, name = sys.argv[1], sys.argv[2]
              pattern = r'(?<![0-9A-Za-z.])' + re.escape(version) + r'(?![0-9A-Za-z.]|-(?:alpha|beta|rc|preview|canary))'
              matched = re.search(pattern, name, re.IGNORECASE) is not None
          except Exception as exc:
              print(f"version match helper error: {exc}", file=sys.stderr)
              sys.exit(2)
          sys.exit(0 if matched else 1)
          PY
            then
              echo "keeping $name"
            else
              status=$?
              if [ "$status" -ne 1 ]; then
                echo "::error::Version match helper failed for $name (exit $status)"
                exit 1
              fi
              gh release delete-asset "$TAG" "$name" --yes && echo "deleted stale $name"
            fi
          done

  desktop:
    name: Build ${{ matrix.id }}
    if: ${{ needs.validate.outputs.version_match == 'true' && needs.targets.outputs.matrix != '[]' }}
    needs:
      - validate
      - create-release
      - targets
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.targets.outputs.matrix) }}

    steps:
      # Pull source
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Xcode 27
        if: ${{ matrix.id == 'ios' }}
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          test "${SDK_VERSION%%.*}" = "27"

      # Use cache on GitHub runners, skipped in local ACT runs
      - name: Setup Node with Yarn cache
        if: ${{ !env.ACT }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Setup Node without cache
        if: ${{ env.ACT }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Use same yarn version everywhere
      - name: Enable Corepack
        shell: bash
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn --version

      # Install the Rust targets needed for each matrix job
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      # Rust artifacts cache
      - name: Rust cache
        if: ${{ !env.ACT }}
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      # Install Linux deps
      - name: Install Linux dependencies
        if: ${{ startsWith(matrix.id, 'linux-') }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libfreetype-dev \
            libfontconfig-dev \
            libudev-dev \
            patchelf \
            xdg-utils \
            gnupg

      # Install JS deps
      - name: Install JS dependencies
        shell: bash
        run: |
          yarn install --frozen-lockfile

      # macOS signing and notarization
      - name: Diagnostic — check notarytool connectivity
        if: ${{ matrix.id == 'macos-universal' }}
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          test -n "${APPLE_ID:-}" || { echo "::error::APPLE_ID is empty"; exit 1; }
          test -n "${APPLE_PASSWORD:-}" || { echo "::error::APPLE_PASSWORD is empty"; exit 1; }
          test -n "${APPLE_TEAM_ID:-}" || { echo "::error::APPLE_TEAM_ID is empty"; exit 1; }
          echo "==> Checking notarytool history: $(date -u +%FT%TZ)"
          xcrun notarytool history --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID"

      - name: Import macOS signing certificate
        if: ${{ matrix.id == 'macos-universal' }}
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_SIGNING_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${APPLE_CERTIFICATE:-}" || { echo "::error::APPLE_CERTIFICATE is empty"; exit 1; }
          test -n "${APPLE_CERTIFICATE_PASSWORD:-}" || { echo "::error::APPLE_CERTIFICATE_PASSWORD is empty"; exit 1; }
          test -n "${KEYCHAIN_PASSWORD:-}" || { echo "::error::KEYCHAIN_PASSWORD is empty"; exit 1; }
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          echo "$APPLE_CERTIFICATE" | base64 -d > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -A
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" || true

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -o '"[^"]*"' | tr -d '"' | head -1)"
          test -n "$IDENTITY" || { echo "::error::No code signing identity found in keychain"; exit 1; }
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "Derived identity: $IDENTITY"

      - name: Build macOS bundles (signed + notarized)
        if: ${{ matrix.id == 'macos-universal' }}
        shell: bash
        env:
          CI: 'true'
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_SIGNING_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          MACOS_PROVISIONING_PROFILE: ${{ secrets.APPLE_MACOS_PROVISIONING_PROFILE_BASE64 }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${MACOS_PROVISIONING_PROFILE:-}" || { echo "::error::APPLE_MACOS_PROVISIONING_PROFILE_BASE64 is empty"; exit 1; }
          PROFILE="$RUNNER_TEMP/embedded.provisionprofile"
          CONFIG="$RUNNER_TEMP/tauri.macOS.conf.json"
          printf '%s' "$MACOS_PROVISIONING_PROFILE" | tr -d '[:space:]' | base64 -d > "$PROFILE"
          test -s "$PROFILE"
          security cms -D -i "$PROFILE" >/dev/null
          python3 -c 'import json,sys; json.dump({"bundle":{"macOS":{"files":{"embedded.provisionprofile":sys.argv[1]}}}},open(sys.argv[2],"w"))' "$PROFILE" "$CONFIG"
          echo "==> Build start: $(date -u +%FT%TZ)"
          yarn tauri build \
            --config "$CONFIG" \
            --target "${{ matrix.tauri_target }}" \
            ${{ matrix.bundle_args }} \
            --ci
          echo "==> Build end: $(date -u +%FT%TZ)"
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/Beaver Notes.app"
          test -f "$APP/Contents/embedded.provisionprofile" || { echo "::error::embedded.provisionprofile missing from app bundle"; exit 1; }

      - name: Notarize and verify macOS DMG
        if: ${{ matrix.id == 'macos-universal' }}
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.validate.outputs.version }}"
          VERSION="${VERSION%%-*}"
          DMG="src-tauri/target/universal-apple-darwin/release/bundle/dmg/Beaver Notes_${VERSION}_universal.dmg"
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/Beaver Notes.app"
          test -f "$DMG" || { echo "::error::DMG not found: $DMG"; exit 1; }
          test -d "$APP" || { echo "::error::App not found: $APP"; exit 1; }
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$DMG"
          spctl -a -t open --context context:primary-signature -vv "$DMG"
          spctl -a -t open --context context:primary-signature -vv "$APP"

      # Linux build (binary only for Flatpak)
      - name: Build Linux binary
        if: ${{ startsWith(matrix.id, 'linux-') }}
        shell: bash
        env:
          CI: 'true'
        run: |
          yarn tauri build \
            --target "${{ matrix.tauri_target }}" \
            --no-bundle \
            --ci

      # macOS release assets: DMG plus updater files
      - name: Stage macOS assets
        if: ${{ matrix.id == 'macos-universal' }}
        shell: bash
        run: |
          set -euo pipefail

          TARGET="${{ matrix.tauri_target }}"
          OUT="release-assets"
          mkdir -p "$OUT"

          find "src-tauri/target/${TARGET}/release/bundle" -type f \
            \( -name "*.dmg" -o -name "*.app.tar.gz" -o -name "*.sig" -o -name "latest.json" \) \
            -exec cp {} "$OUT"/ \;

      # Linux release assets: binary tarball + AppImage + updater signature
      - name: Stage Linux assets
        if: ${{ startsWith(matrix.id, 'linux-') }}
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          VERSION="${{ needs.validate.outputs.version }}"
          TARGET="${{ matrix.tauri_target }}"
          OUT="release-assets"
          BIN_NAME="beaver-notes"
          BIN_PATH="src-tauri/target/${TARGET}/release/${BIN_NAME}"
          
          # Determine architecture
          if [[ "$TARGET" == *"x86_64"* ]]; then
            ARCH="x86_64"
          elif [[ "$TARGET" == *"aarch64"* ]]; then
            ARCH="aarch64"
          else
            echo "::error::Unsupported architecture in target: $TARGET"
            exit 1
          fi
          
          TAR_NAME="Beaver-Notes-${VERSION}-${ARCH}.tar.gz"
          APPIMAGE_NAME="Beaver-Notes-${VERSION}-${ARCH}.AppImage"

          mkdir -p "$OUT"

          # Create FHS tarball
          mkdir -p "portable-root/bin"
          mkdir -p "portable-root/lib/beaver-notes"
          mkdir -p "portable-root/share/applications"
          mkdir -p "portable-root/share/icons/hicolor/1024x1024/apps"
          mkdir -p "portable-root/share/metainfo"

          cp "$BIN_PATH" "portable-root/lib/beaver-notes/"
          cp -r src-tauri/target/${TARGET}/release/bundle/appimage/resources/* "portable-root/lib/beaver-notes/" 2>/dev/null || true
          cp buildResources/icon.png "portable-root/share/icons/hicolor/1024x1024/apps/beaver-notes.png"
          cp flatpak/com.beavernotes.beavernotes.metainfo.xml "portable-root/share/metainfo/"

          # Create wrapper script
          cat > "portable-root/bin/beaver-notes" << 'WRAPPER'
          #!/bin/bash
          exec "$(dirname "$0")/../lib/beaver-notes/beaver-notes" "$@"
          WRAPPER
          chmod +x "portable-root/bin/beaver-notes"

          # Create desktop file
          cat > "portable-root/share/applications/beaver-notes.desktop" << 'DESKTOP'
          [Desktop Entry]
          Name=Beaver Notes
          Comment=Open-source notes that live where you choose
          Exec=beaver-notes %F
          Icon=beaver-notes
          Type=Application
          Categories=Utility;TextEditor;Office;
          MimeType=text/markdown;text/plain;
          Terminal=false
          StartupWMClass=beaver-notes
          DESKTOP

          tar -czf "$TAR_NAME" -C portable-root .

          # Build AppImage
          chmod +x ./scripts/build-appimage.sh
          ./scripts/build-appimage.sh "$VERSION" "$ARCH"
          mv "$TAR_NAME" "$APPIMAGE_NAME" "$OUT/"

          # Sign the tarball for updater
          yarn tauri signer sign \
            --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" \
            "$OUT/$TAR_NAME"

      # Android build
      - name: Install Java
        if: ${{ matrix.id == 'android' }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK
        if: ${{ matrix.id == 'android' }}
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Regenerate Android project for CI
        if: ${{ matrix.id == 'android' }}
        shell: bash
        run: |
          rm -rf src-tauri/gen/android
          yarn tauri android init
          # tauri android init regenerates the manifest without the alternate
          # icon activity-alias entries and a res/ without the custom icons —
          # restore the committed versions so app icon switching works.
          rm -rf src-tauri/gen/android/app/src/main/res
          git checkout -- src-tauri/gen/android/app/src/main/res
          rm -f src-tauri/gen/android/app/src/main/AndroidManifest.xml
          git checkout -- src-tauri/gen/android/app/src/main/AndroidManifest.xml

      - name: Patch Android signing into build.gradle.kts
        if: ${{ matrix.id == 'android' }}
        shell: bash
        run: |
          ./scripts/patch-android-signing.sh
          # Ensure cargo plugin sources exist before patching.
          cargo fetch --manifest-path src-tauri/Cargo.toml || true
          python3 - <<'PY2'
          from pathlib import Path
          import os, re

          def ensure_maven_central(p):
            s=p.read_text()
            changed=False
            # repositories { ... }
            if 'repositories' in s and 'mavenCentral()' not in s:
              s2=re.sub(r'(repositories\s*\{)', r'\1\n        mavenCentral()', s, count=1)
              if s2!=s:
                s=s2
                changed=True
            # pluginManagement { repositories { ... } }
            if 'pluginManagement' in s and 'mavenCentral()' not in s:
              s2=re.sub(r'(pluginManagement\s*\{[^}]*repositories\s*\{)', r'\1\n            mavenCentral()', s, count=1)
              if s2!=s:
                s=s2
                changed=True
            if changed:
              p.write_text(s)
              print(f'added mavenCentral to {p}')
            return changed

          def patch_file(p):
            s=p.read_text()
            s2=s.replace('compileSdk = 34', 'compileSdk = 36').replace('compileSdkVersion 34', 'compileSdkVersion 36')
            s2=re.sub(r'compileSdkVersion\s*\(?\s*34\s*\)?', 'compileSdk = 36', s2)
            if s2!=s:
              print(f'patched {p}')
              p.write_text(s2)
            ensure_maven_central(p)

          root = Path('src-tauri/gen/android')
          for p in root.rglob('build.gradle*'):
            patch_file(p)
          for p in root.rglob('settings.gradle*'):
            ensure_maven_central(p)

          # Patch any android project dir referenced by tauri.settings.gradle (most reliable).
          settings = Path('src-tauri/gen/android/tauri.settings.gradle')
          if settings.exists():
            txt = settings.read_text()
            print('--- tauri.settings.gradle biometry ---')
            for line in txt.splitlines():
              if 'biometry' in line.lower():
                print(line)
            for m in re.finditer(r"project\(':(?:tauri-plugin-[^']*)'\)\.projectDir = new File\(\"([^\"]+)\"\)", txt):
              d = Path(m.group(1))
              if d.exists():
                for p in d.rglob('build.gradle*'):
                  patch_file(p)

          # Patch cargo registry/git checkouts (covers plugin source used by Android build).
          cargo_homes = [Path.home()/'.cargo', Path(os.environ.get('CARGO_HOME', str(Path.home()/'.cargo')))]
          seen=set()
          for cargo in cargo_homes:
            cargo = cargo.resolve()
            if cargo in seen or not cargo.exists():
              continue
            seen.add(cargo)
            for p in cargo.rglob('build.gradle*'):
              sp=str(p)
              if 'tauri-plugin-biometry' in sp or 'tauri-plugin-' in sp:
                patch_file(p)
          PY2

      - name: Setup Android keystore
        if: ${{ matrix.id == 'android' }}
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
          python3 - "$RUNNER_TEMP/keystore.jks" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" <<'PYEOF'
          import sys
          path = "src-tauri/gen/android/keystore.properties"
          with open(path, "w") as f:
              f.write(f"storeFile={sys.argv[1]}\n")
              f.write(f"storePassword={sys.argv[2]}\n")
              f.write(f"keyAlias={sys.argv[3]}\n")
              f.write(f"keyPassword={sys.argv[4]}\n")
          PYEOF

      - name: Set Android build number
        if: ${{ matrix.id == 'android' }}
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD is not set}"
          : "${ANDROID_KEY_ALIAS:?ANDROID_KEY_ALIAS is not set}"
          : "${ANDROID_KEY_PASSWORD:?ANDROID_KEY_PASSWORD is not set}"
          BUILD_NUMBER="${{ needs.validate.outputs.build_number }}"
          python3 - "$BUILD_NUMBER" <<'PYEOF'
          import json, sys
          build = int(sys.argv[1])
          with open("src-tauri/tauri.android.conf.json", "w") as f:
              json.dump({"bundle": {"android": {"versionCode": build}}}, f)
          PYEOF

      - name: Build Android app
        if: ${{ matrix.id == 'android' }}
        shell: bash
        env:
          CI: 'true'
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
        run: |
          yarn tauri android build --apk --aab

      - name: Sign Android AAB/APK with jarsigner and apksigner
        if: ${{ matrix.id == 'android' }}
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          resolve_tool() {
            local tool="$1" root candidate
            if command -v "$tool" >/dev/null 2>&1; then
              command -v "$tool"
              return 0
            fi
            for root in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}"; do
              [ -n "$root" ] || continue
              for candidate in \
                "$root"/build-tools/*/"$tool" \
                "$root"/cmdline-tools/*/bin/"$tool" \
                "$root"/cmdline-tools/latest/bin/"$tool"; do
                if [ -x "$candidate" ]; then
                  echo "$candidate"
                  return 0
                fi
              done
            done
            echo "::error::$tool not found in PATH, ANDROID_HOME, or ANDROID_SDK_ROOT" >&2
            return 1
          }
          APKSIGNER="$(resolve_tool apksigner)"
          APKANALYZER="$(resolve_tool apkanalyzer)"
          echo "ANDROID_APKSIGNER=$APKSIGNER" >> "$GITHUB_ENV"
          echo "ANDROID_APKANALYZER=$APKANALYZER" >> "$GITHUB_ENV"
          KS="$RUNNER_TEMP/keystore.jks"
          aabs=(); while IFS= read -r f; do aabs+=("$f"); done < <(find src-tauri/gen/android/app/build/outputs/bundle -type f -name '*.aab' 2>/dev/null | sort)
          apks=(); while IFS= read -r f; do apks+=("$f"); done < <(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' 2>/dev/null | sort)
          for aab in "${aabs[@]}"; do
            echo "Signing AAB: $aab"
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore "$KS" -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -keypass "$ANDROID_KEY_PASSWORD" "$aab" "$ANDROID_KEY_ALIAS"
          done
          for apk in "${apks[@]}"; do
            echo "Signing APK: $apk"
            "$APKSIGNER" sign \
              --ks "$KS" \
              --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
              --key-pass "pass:$ANDROID_KEY_PASSWORD" \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              "$apk"
          done

      # iOS build
      - name: Regenerate iOS project
        if: ${{ matrix.id == 'ios' }}
        shell: bash
        run: |
          rm -rf src-tauri/gen/apple
          yarn tauri ios init
          # The Tauri template ships its own default icon set — restore the
          # committed custom Assets.xcassets (app icons + alternates).
          rm -rf src-tauri/gen/apple/Assets.xcassets
          git checkout -- src-tauri/gen/apple/Assets.xcassets

          VERSION="${{ needs.validate.outputs.version }}"
          VERSION="${VERSION%%-*}"
          MARKETING_VERSION="$VERSION" \
          CURRENT_PROJECT_VERSION="${{ needs.validate.outputs.build_number }}" \
          ./scripts/setup-ios-share-extension.sh

      - name: Set iOS bundle version
        if: ${{ matrix.id == 'ios' }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.validate.outputs.version }}"
          VERSION="${VERSION%%-*}"
          BUILD_NUMBER="${{ needs.validate.outputs.build_number }}"
          python3 - "$VERSION" "$BUILD_NUMBER" src-tauri/tauri.conf.json src-tauri/tauri.ios.ci.conf.json <<'PYEOF'
          import json, sys
          version, build, base_path, out_path = sys.argv[1:5]
          with open(base_path) as f:
              config = json.load(f)
          config["version"] = version
          config.setdefault("bundle", {}).setdefault("iOS", {})["bundleVersion"] = build
          with open(out_path, "w") as f:
              json.dump(config, f)
          PYEOF

      - name: Set iOS development team
        if: ${{ matrix.id == 'ios' }}
        run: |
          sed -i '' 's/DEVELOPMENT_TEAM: .*$/DEVELOPMENT_TEAM: F8U6VTU2DJ/' \
            src-tauri/gen/apple/project.yml

      - name: Configure iOS distribution signing
        if: ${{ matrix.id == 'ios' }}
        shell: bash
        run: |
          python3 - <<'PYEOF'
          import re
          path = 'src-tauri/gen/apple/project.yml'
          s = open(path).read()
          if 'CODE_SIGN_IDENTITY' not in s:
              s = re.sub(
                  r'(?m)^(\s+)dependencies:\n',
                  '      configs:\n        release:\n          CODE_SIGN_IDENTITY: iPhone Distribution\n'
                  + '\\1dependencies:\n',
                  s,
                  count=1,
              )
          if 'ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES' not in s:
              s = s.replace(
                  'DEVELOPMENT_TEAM: F8U6VTU2DJ',
                  'DEVELOPMENT_TEAM: F8U6VTU2DJ\n'
                  + '        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: \'"AppIcon 1" "AppIcon 2" "AppIcon 3" "AppIcon 4" "AppIcon 5" "AppIcon 6" "AppIcon 7" "AppIcon 8"\'',
              )
          open(path, 'w').write(s)

          # tauri ios build never re-runs XcodeGen, so project.yml edits above do
          # not reach the .xcodeproj — patch the generated pbxproj directly so
          # actool compiles the alternate app icons.
          pbx_path = 'src-tauri/gen/apple/beaver-notes.xcodeproj/project.pbxproj'
          pbx = open(pbx_path).read()
          if 'ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES' not in pbx:
              alt = (
                  'ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES = '
                  + '"\\"AppIcon 1\\" \\"AppIcon 2\\" \\"AppIcon 3\\" \\"AppIcon 4\\" \\"AppIcon 5\\" \\"AppIcon 6\\" \\"AppIcon 7\\" \\"AppIcon 8\\"";\n'
                  + '\t\t\t\tASSETCATALOG_COMPILER_APPICON_NAME = AppIcon;'
              )
              pbx = re.sub(
                  r'(?m)(\n\t\t\t\tINFOPLIST_FILE = "[^"]+";)',
                  lambda m: m.group(1) + '\n\t\t\t\t' + alt,
                  pbx,
              )
              open(pbx_path, 'w').write(pbx)
          PYEOF

      - name: Write Apple API key
        if: ${{ matrix.id == 'ios' }}
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          : "${API_KEY:?APPLE_API_KEY is not set}"
          : "${API_KEY_ID:?APPLE_API_KEY_ID is not set}"
          : "${API_ISSUER:?APPLE_API_ISSUER is not set}"
          mkdir -p "$RUNNER_TEMP/app-store-connect-api-key"
          echo "$API_KEY" > "$RUNNER_TEMP/app-store-connect-api-key/AuthKey_${API_KEY_ID}.p8"

      - name: Install iOS distribution signing
        if: ${{ matrix.id == 'ios' }}
        shell: bash
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.APPLE_IOS_SIGNING_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_IOS_SIGNING_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION_BASE64: ${{ secrets.APPLE_IOS_DISTRIBUTION_PROVISIONING_PROFILE }}
          IOS_SHARE_EXTENSION_PROVISION_BASE64: ${{ secrets.APPLE_IOS_SHARE_EXTENSION_PROVISIONING_PROFILE }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          : "${IOS_SHARE_EXTENSION_PROVISION_BASE64:?APPLE_IOS_SHARE_EXTENSION_PROVISIONING_PROFILE is not set}"
          ./scripts/configure-ios-distribution-signing.sh

      - name: Build iOS app
        if: ${{ matrix.id == 'ios' }}
        shell: bash
        env:
          CI: 'true'
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ format('{0}/app-store-connect-api-key/AuthKey_{1}.p8', runner.temp, secrets.APPLE_API_KEY_ID) }}
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          yarn tauri ios build --export-method app-store-connect --config src-tauri/tauri.ios.ci.conf.json

      # Android release assets: APK and AAB
      - name: Verify Android signing
        if: ${{ matrix.id == 'android' }}
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          BUILD_NUMBER: ${{ needs.validate.outputs.build_number }}
        run: |
          set -euo pipefail
          aabs=(); while IFS= read -r f; do aabs+=("$f"); done < <(find src-tauri/gen/android/app/build/outputs/bundle -type f -name '*.aab' 2>/dev/null | sort)
          apks=(); while IFS= read -r f; do apks+=("$f"); done < <(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' 2>/dev/null | sort)
          if [ ${#aabs[@]} -eq 0 ] && [ ${#apks[@]} -eq 0 ]; then
            echo "::error::No Android AAB/APK outputs found"
            exit 1
          fi
          for aab in "${aabs[@]}"; do
            echo "Verifying AAB: $aab"
            if ! jarsigner -verify "$aab" | tee /tmp/aab-verify.txt | grep -q "jar verified"; then
              echo "::error::AAB is not signed: $aab"
              cat /tmp/aab-verify.txt || true
              exit 1
            fi
          done
          for apk in "${apks[@]}"; do
            echo "Verifying APK: $apk"
            if ! "$ANDROID_APKSIGNER" verify --verbose "$apk"; then
              echo "::error::APK is not signed: $apk"
              exit 1
            fi
          done

          VERSION="${VERSION%%-*}"
          grep -Fqx "tauri.android.versionName=$VERSION" src-tauri/gen/android/app/tauri.properties || { echo "::error::tauri.properties versionName mismatch"; exit 1; }
          grep -Fqx "tauri.android.versionCode=$BUILD_NUMBER" src-tauri/gen/android/app/tauri.properties || { echo "::error::tauri.properties versionCode mismatch"; exit 1; }
          for artifact in "${apks[@]}"; do
            ACTUAL_NAME="$("$ANDROID_APKANALYZER" manifest version-name "$artifact")"
            ACTUAL_CODE="$("$ANDROID_APKANALYZER" manifest version-code "$artifact")"
            test "$ACTUAL_NAME" = "$VERSION" || { echo "::error::$artifact versionName mismatch"; exit 1; }
            test "$ACTUAL_CODE" = "$BUILD_NUMBER" || { echo "::error::$artifact versionCode mismatch"; exit 1; }
          done

      - name: Stage Android assets
        if: ${{ matrix.id == 'android' }}
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          VERSION="${VERSION%%-*}"
          mkdir -p release-assets
          aabs=(); while IFS= read -r f; do aabs+=("$f"); done < <(find src-tauri/gen/android/app/build/outputs/bundle -type f -name '*.aab' 2>/dev/null | sort)
          apks=(); while IFS= read -r f; do apks+=("$f"); done < <(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' 2>/dev/null | sort)
          test ${#aabs[@]} -eq 1 || { echo "::error::Expected exactly one AAB, got ${#aabs[@]}"; exit 1; }
          test ${#apks[@]} -eq 1 || { echo "::error::Expected exactly one APK, got ${#apks[@]}"; exit 1; }
          cp "${aabs[0]}" "release-assets/Beaver.Notes_${VERSION}_android.aab"
          cp "${apks[0]}" "release-assets/Beaver.Notes_${VERSION}_android.apk"
          unsigned="$(find release-assets -type f -name '*-unsigned*' -print -quit)"
          test -z "$unsigned" || { echo "::error::unsigned asset: $unsigned"; exit 1; }

      # iOS release assets
      - name: Find iOS IPA
        if: ${{ matrix.id == 'ios' }}
        id: find-ipa
        shell: bash
        run: |
          IPA=$(find src-tauri/gen/apple/build -name "*.ipa" -type f | head -1)
          if [ -n "$IPA" ]; then
            echo "ipa-path=$IPA" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No .ipa file found"
          fi

      - name: Verify and stage iOS assets
        if: ${{ matrix.id == 'ios' && steps.find-ipa.outputs.ipa-path != '' }}
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          BUILD_NUMBER: ${{ needs.validate.outputs.build_number }}
        run: |
          set -euo pipefail
          VERSION="${VERSION%%-*}"
          IPA="${{ steps.find-ipa.outputs.ipa-path }}"
          TMP="$(mktemp -d /tmp/ipa-check.XXXXXX)"
          unzip -q "$IPA" -d "$TMP"
          APP="$(find "$TMP/Payload" -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP" ]; then
            echo "::error::No .app found inside IPA: $IPA"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP"
          security cms -D -i "$APP/embedded.mobileprovision" >/dev/null

          # Verify provisioning profile matches build
          PROVISION_INFO=$(security cms -D -i "$APP/embedded.mobileprovision")
          echo "$PROVISION_INFO" | grep -q "F8U6VTU2DJ" || { echo "::error::Provisioning profile team ID mismatch"; exit 1; }
          echo "$PROVISION_INFO" | grep -q "com.beavernotes.beaver-notes" || echo "::warning::Bundle ID not found in provisioning profile"
          echo "Provisioning profile verified"

          # Verify bundle version survived the build
          BUNDLE_VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" "$APP/Info.plist")
          SHORT_VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP/Info.plist")
          echo "IPA CFBundleShortVersionString=$SHORT_VERSION CFBundleVersion=$BUNDLE_VERSION"
          test "$SHORT_VERSION" = "$VERSION" || { echo "::error::IPA short version mismatch"; exit 1; }
          test "$BUNDLE_VERSION" = "$BUILD_NUMBER" || { echo "::error::IPA build number mismatch (got $BUNDLE_VERSION, expected $BUILD_NUMBER)"; exit 1; }

          mkdir -p release-assets
          cp "$IPA" release-assets/

      # Upload iOS IPA to TestFlight via App Store Connect API
      - name: Upload to TestFlight
        if: ${{ matrix.id == 'ios' && steps.find-ipa.outputs.ipa-path != '' }}
        uses: apple-actions/upload-testflight-build@v4
        with:
          app-path: ${{ steps.find-ipa.outputs.ipa-path }}
          issuer-id: ${{ secrets.APPLE_API_ISSUER }}
          api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPLE_API_KEY }}
          wait-for-processing: false

      - name: Upload to release
        if: ${{ hashFiles('release-assets/*') != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CUSTOM_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.validate.outputs.tag_name }}" release-assets/* --clobber

  windows:
    name: Build Windows (via OSSign)
    if: ${{ needs.validate.outputs.version_match == 'true' && needs.targets.outputs.windows == 'true' }}
    needs:
      - validate
      - create-release
      - targets
    runs-on: windows-latest

    steps:
      - name: Guard Windows signing token
        shell: pwsh
        env:
          SIGNING_TOKEN: ${{ secrets.SIGNING_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_TOKEN)) { throw "SIGNING_TOKEN is not set" }

      - name: Dispatch Windows signing
        uses: ossign/actions/workflow/dispatch@main
        id: dispatch
        with:
          username: beaver-notes
          token: ${{ secrets.SIGNING_TOKEN }}

      - name: Parse signed artifacts
        shell: bash
        env:
          SIGNED_ARTIFACTS: ${{ steps.dispatch.outputs.signed_artifacts }}
        run: |
          printf '%s' "$SIGNED_ARTIFACTS" > artifacts.json
          jq -e . artifacts.json >/dev/null

      - name: Download signed artifacts
        shell: bash
        run: |
          mkdir -p signed
          jq -r '.[].browser_download_url' artifacts.json | while IFS= read -r url; do
            [ -n "$url" ] || continue
            echo "Downloading $url"
            curl -fL -o "signed/$(basename "$url")" "$url"
          done

      - name: Verify signed Windows artifacts
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          $expected = $env:EXPECTED_VERSION.Split('-')[0]
          function Assert-SignedExe([string]$path, [string]$expected) {
            $sig = Get-AuthenticodeSignature -FilePath $path
            if ($sig.Status -ne 'Valid') { throw "Invalid signature on $path ($($sig.Status))" }
            $actual = (Get-Item -LiteralPath $path).VersionInfo.ProductVersion
            if ([string]::IsNullOrWhiteSpace($actual) -or ($actual -ne $expected -and $actual -notlike "$expected.*")) {
              throw "Embedded version mismatch on $path ($actual vs $expected)"
            }
          }
          $files = @(Get-ChildItem -Path signed -File)
          if ($files.Count -eq 0) { throw "No signed Windows artifacts were downloaded" }
          foreach ($f in $files) {
            if ($f.Name -notlike "*$expected*") { throw "Unexpected artifact version/name: $($f.Name)" }
            switch ($f.Extension.ToLowerInvariant()) {
              '.exe' { Assert-SignedExe $f.FullName $expected }
              '.zip' {
                $dir = Join-Path $env:RUNNER_TEMP ("winzip-" + [guid]::NewGuid().ToString('N'))
                Expand-Archive -Path $f.FullName -DestinationPath $dir -Force
                $exes = @(Get-ChildItem -Path $dir -Filter *.exe -Recurse -File)
                if ($exes.Count -eq 0) { throw "No exe found in $($f.Name)" }
                foreach ($exe in $exes) { Assert-SignedExe $exe.FullName $expected }
              }
              '.sig' {
                $payload = @($files | Where-Object { $_.Name -ne $f.Name -and $f.Name.StartsWith($_.BaseName) })
                if ($payload.Count -eq 0) { throw "No paired payload for $($f.Name)" }
              }
              default { throw "Unexpected Windows artifact type: $($f.Name)" }
            }
          }

      - name: Stage Windows assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-assets
          mv signed release-assets

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CUSTOM_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.validate.outputs.tag_name }}" release-assets/* --clobber --repo "${{ github.repository }}"
