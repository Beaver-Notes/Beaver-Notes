name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  validate:
    name: Validate versions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.tag.outputs.tag_name }}
      version_match: ${{ steps.jurisdiction.outputs.version_match }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node Setup
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        shell: bash
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      # package.json is the source of truth for the release version.
      - name: Read version from package.json
        id: version
        shell: bash
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # If this is a tag push, use that tag. Otherwise build one from package.json.
      - name: Determine release tag
        id: tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "tag_name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=v${{ steps.version.outputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      # Fail if package.json, tauri.conf.json, and Cargo.toml disagree.
      # Also fail if a pre-release version (beta) is accidentally pushed as stable.
      - name: Fail on version drift
        shell: bash
        run: |
          set -euo pipefail

          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAURI_VERSION="$(node -e "console.log(JSON.parse(require('fs').readFileSync('./src-tauri/tauri.conf.json', 'utf8')).version)")"
          CARGO_VERSION="$(node - <<'NODE'
          const fs = require('fs');
          const txt = fs.readFileSync('./src-tauri/Cargo.toml', 'utf8');
          const m = txt.match(/^\s*version\s*=\s*"(.*?)"/m);
          console.log(m ? m[1] : '');
          NODE
          )"

          echo "package.json: $PKG_VERSION"
          echo "tauri.conf.json: $TAURI_VERSION"
          echo "Cargo.toml: $CARGO_VERSION"

          test "$PKG_VERSION" = "$TAURI_VERSION"
          test "$PKG_VERSION" = "$CARGO_VERSION"

      - name: Check jurisdiction
        id: jurisdiction
        shell: bash
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$PKG_VERSION" == *"-"* ]]; then
            echo "version_match=false" >> "$GITHUB_OUTPUT"
            echo "Skipping — this is a pre-release version, use the beta workflow."
          else
            echo "version_match=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        shell: bash
        run: |
          yarn install --frozen-lockfile

      - name: Run lint
        shell: bash
        run: |
          yarn lint

      - name: Run typecheck
        shell: bash
        run: |
          yarn typecheck

      - name: Run unit tests
        shell: bash
        run: yarn test

      - name: Install Linux dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libfreetype-dev \
            libfontconfig-dev \
            patchelf \
            xdg-utils \
            gnupg

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: validate

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Audit npm dependencies
        shell: bash
        run: |
          yarn audit --audit-level=high

      - name: Run knip (dead code detection)
        shell: bash
        run: |
          yarn knip --no-progress

      # Rust audit — catches RUSTSEC advisories
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit Rust dependencies
        shell: bash
        run: |
          cd src-tauri && cargo audit

  create-release:
    name: Create draft release
    if: ${{ needs.validate.outputs.version_match == 'true' }}
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.id }}

    steps:
      - name: Create empty draft release
        id: create
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag_name }}
          name: ${{ needs.validate.outputs.version }}
          draft: true
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.CUSTOM_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

  desktop:
    name: Build ${{ matrix.id }}
    if: ${{ needs.validate.outputs.version_match == 'true' }}
    needs:
      - validate
      - create-release
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Universal mac build
          - id: macos-universal
            runner: macos-latest
            rust_targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
            tauri_target: 'universal-apple-darwin'
            bundle_args: '--bundles app,dmg'
            asset_suffix: 'macos-universal'

          # Linux x64 binary only (packaged as portable tar.gz)
          - id: linux-x64
            runner: ubuntu-24.04
            rust_targets: 'x86_64-unknown-linux-gnu'
            tauri_target: 'x86_64-unknown-linux-gnu'
            asset_suffix: 'linux-x64'

          # Linux ARM64 binary only
          - id: linux-arm64
            runner: ubuntu-24.04-arm
            rust_targets: 'aarch64-unknown-linux-gnu'
            tauri_target: 'aarch64-unknown-linux-gnu'
            asset_suffix: 'linux-arm64'

          # Android build (APK + AAB)
          - id: android
            runner: ubuntu-24.04
            rust_targets: 'aarch64-linux-android,x86_64-linux-android'
            asset_suffix: 'android'

          # iOS build
          - id: ios
            runner: macos-latest
            rust_targets: 'aarch64-apple-ios'
            asset_suffix: 'ios'

    steps:
      # Pull source
      - name: Checkout
        uses: actions/checkout@v4

      # Use cache on GitHub runners, skipped in local ACT runs
      - name: Setup Node with Yarn cache
        if: ${{ !env.ACT }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Setup Node without cache
        if: ${{ env.ACT }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Use same yarn version everywhere
      - name: Enable Corepack
        shell: bash
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn --version

      # Install the Rust targets needed for each matrix job
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      # Rust artifacts cache
      - name: Rust cache
        if: ${{ !env.ACT }}
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      # Install Linux deps
      - name: Install Linux dependencies
        if: ${{ startsWith(matrix.id, 'linux-') }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libfreetype-dev \
            libfontconfig-dev \
            patchelf \
            xdg-utils \
            gnupg

      # Install JS deps
      - name: Install JS dependencies
        shell: bash
        run: |
          yarn install --frozen-lockfile

      # macOS signing and notarization
      - name: Diagnostic — check notarytool connectivity
        if: ${{ matrix.id == 'macos-universal' }}
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "==> Checking notarytool history: $(date -u +%FT%TZ)"
          xcrun notarytool history \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" 2>&1 | head -5 || echo "WARNING: notarytool check failed"

      - name: Build macOS bundles (signed + notarized)
        if: ${{ matrix.id == 'macos-universal' }}
        shell: bash
        env:
          CI: 'true'
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_SIGNING_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          echo "==> Build start: $(date -u +%FT%TZ)"
          yarn tauri build \
            --target "${{ matrix.tauri_target }}" \
            ${{ matrix.bundle_args }} \
            --ci
          echo "==> Build end: $(date -u +%FT%TZ)"

      # Linux build (binary only for Flatpak)
      - name: Build Linux binary
        if: ${{ startsWith(matrix.id, 'linux-') }}
        shell: bash
        env:
          CI: 'true'
        run: |
          yarn tauri build \
            --target "${{ matrix.tauri_target }}" \
            --no-bundle \
            --ci

      # macOS release assets: DMG plus updater files
      - name: Stage macOS assets
        if: ${{ matrix.id == 'macos-universal' }}
        shell: bash
        run: |
          set -euo pipefail

          TARGET="${{ matrix.tauri_target }}"
          OUT="release-assets"
          mkdir -p "$OUT"

          find "src-tauri/target/${TARGET}/release/bundle" -type f \
            \( -name "*.dmg" -o -name "*.app.tar.gz" -o -name "*.sig" -o -name "latest.json" \) \
            -exec cp {} "$OUT"/ \;

      # Linux release assets: binary tarball + AppImage + updater signature
      - name: Stage Linux assets
        if: ${{ startsWith(matrix.id, 'linux-') }}
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          VERSION="${{ needs.validate.outputs.version }}"
          TARGET="${{ matrix.tauri_target }}"
          OUT="release-assets"
          BIN_NAME="beaver-notes"
          BIN_PATH="src-tauri/target/${TARGET}/release/${BIN_NAME}"
          
          # Determine architecture
          if [[ "$TARGET" == *"x86_64"* ]]; then
            ARCH="x86_64"
          elif [[ "$TARGET" == *"aarch64"* ]]; then
            ARCH="aarch64"
          else
            echo "::error::Unsupported architecture in target: $TARGET"
            exit 1
          fi
          
          TAR_NAME="Beaver-Notes-${VERSION}-${ARCH}.tar.gz"
          APPIMAGE_NAME="Beaver-Notes-${VERSION}-${ARCH}.AppImage"

          mkdir -p "$OUT"

          # Create FHS tarball
          mkdir -p "portable-root/bin"
          mkdir -p "portable-root/lib/beaver-notes"
          mkdir -p "portable-root/share/applications"
          mkdir -p "portable-root/share/icons/hicolor/1024x1024/apps"
          mkdir -p "portable-root/share/metainfo"

          cp "$BIN_PATH" "portable-root/lib/beaver-notes/"
          cp -r src-tauri/target/${TARGET}/release/bundle/appimage/resources/* "portable-root/lib/beaver-notes/" 2>/dev/null || true
          cp buildResources/icon.png "portable-root/share/icons/hicolor/1024x1024/apps/beaver-notes.png"
          cp flatpak/com.beavernotes.beavernotes.metainfo.xml "portable-root/share/metainfo/"

          # Create wrapper script
          cat > "portable-root/bin/beaver-notes" << 'WRAPPER'
          #!/bin/bash
          exec "$(dirname "$0")/../lib/beaver-notes/beaver-notes" "$@"
          WRAPPER
          chmod +x "portable-root/bin/beaver-notes"

          # Create desktop file
          cat > "portable-root/share/applications/beaver-notes.desktop" << 'DESKTOP'
          [Desktop Entry]
          Name=Beaver Notes
          Comment=Open-source notes that live where you choose
          Exec=beaver-notes %F
          Icon=beaver-notes
          Type=Application
          Categories=Utility;TextEditor;Office;
          MimeType=text/markdown;text/plain;
          Terminal=false
          StartupWMClass=beaver-notes
          DESKTOP

          tar -czf "$OUT/$TAR_NAME" -C portable-root .

          # Build AppImage
          chmod +x ./scripts/build-appimage.sh
          ./scripts/build-appimage.sh "$VERSION" "$ARCH"
          mv "$APPIMAGE_NAME" "$OUT/"

          # Sign the tarball for updater
          yarn tauri signer sign \
            --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" \
            "$OUT/$TAR_NAME"

      # Android build
      - name: Install Java
        if: ${{ matrix.id == 'android' }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK
        if: ${{ matrix.id == 'android' }}
        uses: android-actions/setup-android@v3

      - name: Regenerate Android project for CI
        if: ${{ matrix.id == 'android' }}
        shell: bash
        run: |
          rm -rf src-tauri/gen/android
          yarn tauri android init

      - name: Patch Android signing into build.gradle.kts
        if: ${{ matrix.id == 'android' }}
        shell: bash
        run: |
          ./scripts/patch-android-signing.sh

      - name: Setup Android keystore
        if: ${{ matrix.id == 'android' }}
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build Android app
        if: ${{ matrix.id == 'android' }}
        shell: bash
        env:
          CI: 'true'
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
        run: |
          yarn tauri android build --apk --aab

      # iOS build
      - name: Regenerate iOS project
        if: ${{ matrix.id == 'ios' }}
        shell: bash
        run: |
          rm -rf src-tauri/gen/apple
          yarn tauri ios init

      - name: Fix iOS bundle version
        if: ${{ matrix.id == 'ios' }}
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version.replace(/-.*$/, '')")"
          sed -i '' "s/CFBundleShortVersionString: '.*'/CFBundleShortVersionString: '$VERSION'/" \
            src-tauri/gen/apple/project.yml
          sed -i '' "s/CFBundleVersion: '.*'/CFBundleVersion: '$VERSION'/" \
            src-tauri/gen/apple/project.yml

      - name: Set iOS development team
        if: ${{ matrix.id == 'ios' }}
        run: |
          sed -i '' 's/DEVELOPMENT_TEAM: .*$/DEVELOPMENT_TEAM: F8U6VTU2DJ/' \
            src-tauri/gen/apple/project.yml

      - name: Configure iOS distribution signing
        if: ${{ matrix.id == 'ios' }}
        shell: bash
        run: |
          python3 - <<'PYEOF'
          import re
          path = 'src-tauri/gen/apple/project.yml'
          s = open(path).read()
          if 'CODE_SIGN_IDENTITY' not in s:
              s = re.sub(
                  r'(?m)^(\s+)dependencies:\n',
                  '      configs:\n        release:\n          CODE_SIGN_IDENTITY: iPhone Distribution\n'
                  + '\\1dependencies:\n',
                  s,
                  count=1,
              )
          open(path, 'w').write(s)
          PYEOF

      - name: Write Apple API key
        if: ${{ matrix.id == 'ios' }}
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/app-store-connect-api-key"
          echo "$API_KEY" > "$RUNNER_TEMP/app-store-connect-api-key/AuthKey_${API_KEY_ID}.p8"

      - name: Import iOS signing certificate
        if: ${{ matrix.id == 'ios' }}
        shell: bash
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.APPLE_IOS_SIGNING_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_IOS_SIGNING_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"

          # Decode certificate
          echo "$IOS_CERTIFICATE_BASE64" | base64 -d > "$CERTIFICATE_PATH"

          # Create and configure temporary keychain (no auto-lock timeout)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          security import "$CERTIFICATE_PATH" \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          # Set keychain search list
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain

          # Allow codesign to access keychain without prompt
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Build iOS app
        if: ${{ matrix.id == 'ios' }}
        shell: bash
        env:
          CI: 'true'
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ format('{0}/app-store-connect-api-key/AuthKey_{1}.p8', runner.temp, secrets.APPLE_API_KEY_ID) }}
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          IOS_CERTIFICATE: ${{ secrets.APPLE_IOS_SIGNING_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_IOS_SIGNING_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.APPLE_IOS_DISTRIBUTION_PROVISIONING_PROFILE }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          yarn tauri ios build --export-method app-store-connect

      # Android release assets: APK and AAB
      - name: Stage Android assets
        if: ${{ matrix.id == 'android' }}
        shell: bash
        run: |
          set -euo pipefail

          OUT="release-assets"
          mkdir -p "$OUT"

          find "src-tauri/gen/android/app/build/outputs" -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -exec cp {} "$OUT"/ \;

      # iOS release assets
      - name: Find iOS IPA
        if: ${{ matrix.id == 'ios' }}
        id: find-ipa
        shell: bash
        run: |
          IPA=$(find src-tauri/gen/apple/build -name "*.ipa" -type f | head -1)
          if [ -n "$IPA" ]; then
            echo "ipa-path=$IPA" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No .ipa file found"
          fi

      - name: Stage iOS assets
        if: ${{ matrix.id == 'ios' && steps.find-ipa.outputs.ipa-path != '' }}
        shell: bash
        run: |
          mkdir -p release-assets
          cp "${{ steps.find-ipa.outputs.ipa-path }}" release-assets/

      # Upload iOS IPA to TestFlight via App Store Connect API
      - name: Upload to TestFlight
        if: ${{ matrix.id == 'ios' && steps.find-ipa.outputs.ipa-path != '' }}
        uses: apple-actions/upload-testflight-build@v4
        with:
          app-path: ${{ steps.find-ipa.outputs.ipa-path }}
          issuer-id: ${{ secrets.APPLE_API_ISSUER }}
          api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPLE_API_KEY }}
          wait-for-processing: false

      - name: Upload to release
        if: ${{ hashFiles('release-assets/*') != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CUSTOM_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.validate.outputs.tag_name }}" release-assets/* --clobber

  windows:
    name: Build Windows (via OSSign)
    if: ${{ needs.validate.outputs.version_match == 'true' }}
    needs:
      - validate
      - create-release
    runs-on: ubuntu-latest

    steps:
      - name: Dispatch Windows signing
        uses: ossign/actions/workflow/dispatch@main
        id: dispatch
        with:
          username: beaver-notes
          token: ${{ secrets.SIGNING_TOKEN }}

      - name: Parse signed artifacts
        shell: bash
        run: |
          printf "%s" "${{ steps.dispatch.outputs.signed_artifacts }}" > artifacts.json
          echo "parsed=$(cat artifacts.json)" >> "$GITHUB_OUTPUT"

      - name: Download signed artifacts
        shell: bash
        run: |
          mkdir -p signed
          for url in $(jq -r '.[].browser_download_url' artifacts.json); do
            echo "Downloading $url"
            curl -L -o "signed/$(basename "$url")" "$url"
          done

      - name: Stage Windows assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-assets
          mv signed release-assets

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CUSTOM_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.validate.outputs.tag_name }}" release-assets/* --clobber
