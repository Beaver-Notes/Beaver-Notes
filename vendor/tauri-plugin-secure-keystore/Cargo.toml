[package]
name = "tauri-plugin-secure-keystore"
version = "0.1.0"
description = "Android Keystore-backed secure storage for Beaver Notes"
authors = ["Daniele Rolli"]
license = "MIT"
repository = "https://github.com/Beaver-Notes/Beaver-Notes"
edition = "2021"
rust-version = "1.77.2"
links = "tauri-plugin-secure-keystore"

[lib]
name = "tauri_plugin_secure_keystore"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
