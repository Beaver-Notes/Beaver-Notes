<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" content="#fafafa" />

    <meta name="referrer" content="no-referrer" />
    <script>try{var t=localStorage.getItem('theme');var m=window.matchMedia('(prefers-color-scheme: dark)').matches;var d=t==='dark'||((t==='system'||!t)&&m);if(d)document.documentElement.classList.add('dark');var bg=d?'#171717':'#fafafa';document.documentElement.style.backgroundColor=bg;var mc=document.querySelector('meta[name=\"theme-color\"]');if(mc)mc.setAttribute('content',bg);}catch(e){}</script>
    <style>html,body,#app{background:#fafafa;min-height:100dvh}html.dark,html.dark body,html.dark #app{background:#171717}html,body{margin:0}body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent}</style>
    <title>Beaver Notes</title>
  </head>
  <body>
    <div id="app" class="dark:border-gray-700"></div>

    <!-- Include external JavaScript file -->
    <script src="./src/utils/direction.js" type="module" defer></script>
    <script src="./src/index.js" type="module"></script>
  </body>
</html>
